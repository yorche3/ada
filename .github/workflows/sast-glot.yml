name: "SAST - Glot (ShellCheck)"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
  workflow_dispatch:

permissions:
  security-events: write # Requerido para subir el SARIF a CodeQL
  contents: read

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        # Esta acción oficial ya busca archivos .sh y .bash, o archivos con shebang.
        # Además, convierte los resultados automáticamente a SARIF.
        uses: redhat-plumbers-in-action/differential-shellcheck@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Excluimos los snapshots cerrados para que no generen ruido
          # Ajusta este path si es necesario
          exclude-path: 'scripts/versions/**/*.sh'

      - name: Upload SARIF results
        # El paso anterior genera un archivo llamado differential-shellcheck.sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: differential-shellcheck.sarif
          category: "shellcheck-glot"
